name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test backend modules
        run: |
          cd nz-server
          ./mvnw -q test

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - name: Test project CLI
        run: |
          cd tools/nz-cli
          node --test
          cd ../..
          ./nz doctor
          ./nz delivery check
          docker compose --env-file deploy/.env.example -f deploy/compose.yaml --profile redis --profile storage config --quiet

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: pnpm
          cache-dependency-path: nz-web/pnpm-lock.yaml
      - name: Install and verify nz-web
        run: |
          cd nz-web
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

  delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and build delivery images
        run: |
          docker compose \
            --env-file deploy/.env.example \
            -f deploy/compose.yaml \
            --profile redis \
            --profile storage \
            build backend frontend
