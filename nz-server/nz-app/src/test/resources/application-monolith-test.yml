spring:
  datasource:
    url: jdbc:h2:mem:nz-monolith-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/monolith-schema.sql

warm-flow:
  enabled: true
  banner: false
  ui: false

nz:
  modules:
    system:
      initialize-data: false
    job:
      enabled: true
    demo:
      enabled: false
    generator:
      enabled: false
  file:
    config-encryption-key: monolith-test-file-config-key-at-least-32-characters
